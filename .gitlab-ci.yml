# Use the official .NET image, based on Debian.
# See https://hub.docker.com/_/microsoft-dotnet-sdk/ for more info.
image: mcr.microsoft.com/dotnet/sdk:10.0

build:
  stage: build
  before_script:
    - apt-get update && apt-get -y install git
  script:
    # Restore any NuGet packages.
    - dotnet restore -p:EnableWindowsTargeting=true ./updater/updater.csproj
    - dotnet restore -p:EnableWindowsTargeting=true ./updater-test/updater-test.csproj
    # Build updater and the test project.
    - dotnet build -p:EnableWindowsTargeting=true ./updater/updater.csproj
    - dotnet build -p:EnableWindowsTargeting=true ./updater-test/updater-test.csproj
    # Note: The moz-checksum-generator project cannot be built here, because it
    # uses Windows Forms and those need a Windows OS to build properly.
